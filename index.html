<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
            font-family: Arial, sans-serif;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .cell.taken {
            pointer-events: none;
        }

        .message {
            margin-top: 20px;
            font-size: 1.5rem;
            text-align: center;
            color: white;
        }

        .player-x {
            color: blue;
        }

        .player-o {
            color: green;
        }

        .play-again {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4caf50;
            color: white;
        }

        .play-again:hover {
            background-color: #45a049;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: white;
            font-size: 1rem;
        }

        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: gold;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            animation: fadeOut 3s forwards;
            pointer-events: none;
        }

        .draw-celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: red;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            animation: fadeOut 3s forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div>
        <div class="game-container" id="gameBoard"></div>
        <div class="message" id="message"></div>
        <button class="play-again" id="playAgain" style="display: none;">Play Again</button>
        <div class="footer">App Made by Rupak Kushwaha</div>
    </div>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const message = document.getElementById('message');
        const playAgainButton = document.getElementById('playAgain');

        let currentPlayer = 'X';
        const board = Array(9).fill(null);

        const winSound = new Audio('https://www.soundjay.com/button/beep-07.wav');
        const drawSound = new Audio('https://www.soundjay.com/button/beep-06.wav');

        function showCelebration(winner) {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = `${winner} Wins! 🎉`;
            document.body.appendChild(celebration);
            winSound.play();
            setTimeout(() => {
                celebration.remove();
            }, 3000);
        }

        function showDrawReaction() {
            const drawCelebration = document.createElement('div');
            drawCelebration.className = 'draw-celebration';
            drawCelebration.textContent = "It's a Draw! 🤝";
            document.body.appendChild(drawCelebration);
            drawSound.play();
            setTimeout(() => {
                drawCelebration.remove();
            }, 3000);
        }

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let combination of winningCombinations) {
                const [a, b, c] = combination;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }

            return board.includes(null) ? null : 'Draw';
        }

        function handleCellClick(e) {
            const index = e.target.dataset.index;

            if (!board[index]) {
                board[index] = currentPlayer;
                e.target.textContent = currentPlayer;
                e.target.classList.add('taken');

                const winner = checkWinner();
                if (winner) {
                    if (winner === 'Draw') {
                        showDrawReaction();
                    } else {
                        showCelebration(winner);
                    }
                    message.textContent = winner === 'Draw' ? "It's a Draw!" : `${winner} Wins!`;
                    gameBoard.querySelectorAll('.cell').forEach(cell => cell.classList.add('taken'));
                    playAgainButton.style.display = 'block';
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    message.innerHTML = `Player <span class="player-${currentPlayer.toLowerCase()}">${currentPlayer}</span>'s Turn`;
                }
            }
        }

        function initializeGame() {
            gameBoard.innerHTML = '';
            message.innerHTML = `Player <span class="player-${currentPlayer.toLowerCase()}">${currentPlayer}</span>'s Turn`;
            playAgainButton.style.display = 'none';

            board.fill(null);
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                gameBoard.appendChild(cell);
            }
        }

        playAgainButton.addEventListener('click', () => {
            currentPlayer = 'X';
            initializeGame();
        });

        initializeGame();
    </script>
</body>
</html>
